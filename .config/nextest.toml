# The corpus gates need `scripts/fetch-corpus.sh` and take minutes in debug,
# the network tests need the network, and the Verilator tests Verilator 5,
# so a plain run leaves them to their profiles and CI.
[profile.default]
default-filter = 'not test(/(^|::)(corpus|network|verilator)_/)'

# The corpus gates alone, every failure at once. Run with `--release`: the
# corpus takes minutes in debug.
[profile.corpus]
default-filter = 'test(/(^|::)corpus_/)'
fail-fast = false

# What fetches from a real host.
[profile.network]
default-filter = 'test(/(^|::)network_/)'

# What builds with Verilator, which must be on the `PATH`.
[profile.verilator]
default-filter = 'test(/(^|::)verilator_/)'

# Everything, the corpus gates and network tests included. Run with
# `--release` too.
[profile.all]
default-filter = 'all()'
