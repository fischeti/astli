[package]
name = "snitch_ssr"
dev = ["test/**"]

[dependencies]
common_cells = { git = "https://github.com/pulp-platform/common_cells.git", version = "2.0.0-beta.3" }
# Its testbenches drive the TCDM with `tcdm_test`, and a dependency cannot
# have a feature for them alone.
tcdm_interface = { path = "../tcdm_interface", features = ["test"] }

[dev-dependencies]
register_interface = { git = "https://github.com/pulp-platform/register_interface.git", rev = "common-cells-v2" }
