[package]
name = "floo_noc"
exclude = [
    # No longer built.
    "hw/deprecated/**",
]

[dependencies]
axi = { git = "https://github.com/pulp-platform/axi.git", rev = "0ccc838fe06aeeb857eb83c6be9a915c4bf99566" }
axi_riscv_atomics = { git = "https://github.com/pulp-platform/axi_riscv_atomics.git", rev = "common-cells-v2" }
common_cells = { git = "https://github.com/pulp-platform/common_cells.git", version = "2.0.0-beta.3" }
common_verification = { git = "https://github.com/pulp-platform/common_verification.git", version = "0.2.3" }
fpnew = { git = "https://github.com/pulp-platform/cvfpu.git", rev = "common-cells-v2" }
idma = { git = "https://github.com/pulp-platform/idma.git", rev = "78ab25f13a88658be3f7b4d1d7b1074effaf42eb" }

[resolve]
pinned = ["axi", "common_cells"]

# Its cells for the FPGA declare what its RTL cells do.
[described.tech_cells_generic]
exclude = ["src/fpga/**"]

# Its headers, and the generated monolith alone, where the same modules are
# generated one to a file beside it.
[described.idma]
include-dirs = ["src/include", "target/rtl/include", "test"]
exclude = [
    "target/rtl/idma_backend_*",
    "target/rtl/idma_desc64_*",
    "target/rtl/idma_legalizer_*",
    "target/rtl/idma_reg*",
    "target/rtl/idma_transport_layer_*",
    "target/rtl/tb_idma_backend_*",
]
