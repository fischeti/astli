[package]
name = "cheshire"
# The FPGA flow, with the vendor's primitives.
exclude = ["target/xilinx/**"]

[dependencies]
apb = { git = "https://github.com/pulp-platform/apb.git", version = "0.2.4" }
apb_uart = { git = "https://github.com/pulp-platform/apb_uart.git", version = "0.2.3" }
axi = { git = "https://github.com/pulp-platform/axi.git", version = "0.39.8" }
axi_llc = { git = "https://github.com/pulp-platform/axi_llc.git", version = "0.3.0" }
axi_riscv_atomics = { git = "https://github.com/pulp-platform/axi_riscv_atomics.git", version = "0.8.2" }
axi_rt = { git = "https://github.com/pulp-platform/axi_rt.git", version = "0.0.0-alpha.10" }
axi_vga = { git = "https://github.com/pulp-platform/axi_vga.git", version = "0.1.3" }
clic = { git = "https://github.com/pulp-platform/clic.git", version = "3.0.0" }
clint = { git = "https://github.com/pulp-platform/clint.git", version = "0.3.0" }
common_cells = { git = "https://github.com/pulp-platform/common_cells.git", version = "1.38.0" }
common_verification = { git = "https://github.com/pulp-platform/common_verification.git", version = "0.2.3" }
cva6 = { git = "https://github.com/pulp-platform/cva6.git", rev = "pulp-v2.0.0" }
dram_rtl_sim = { git = "https://github.com/pulp-platform/dram_rtl_sim.git", version = "0.1.2" }
idma = { git = "https://github.com/pulp-platform/iDMA.git", version = "0.6.4" }
irq_router = { git = "https://github.com/pulp-platform/irq_router.git", version = "0.0.1-beta.1" }
opentitan_peripherals = { git = "https://github.com/pulp-platform/opentitan_peripherals.git", version = "0.4.0" }
register_interface = { git = "https://github.com/pulp-platform/register_interface.git", version = "0.4.5" }
riscv-dbg = { git = "https://github.com/pulp-platform/riscv-dbg.git", version = "0.8.1" }
serial_link = { git = "https://github.com/pulp-platform/serial_link.git", version = "2.0.0" }
unbent = { git = "https://github.com/pulp-platform/unbent.git", version = "0.1.6" }

[resolve]
pinned = ["axi", "register_interface"]

# Its cells for the FPGA declare what its RTL cells do.
[described.tech_cells_generic]
exclude = ["src/fpga/**"]

# Read as cva6's own manifest reads it, at the configuration cheshire builds.
[described.cva6]
sources = ["core", "common"]
include-dirs = ["core/include"]
exclude = [
    # The FPGA's variant of what `tc_sram_wrapper.sv` declares.
    "common/local/util/tc_sram_fpga_wrapper.sv",
    # hpdcache is a submodule, which a checkout leaves empty.
    "common/local/util/hpdcache_*",
    "core/cache_subsystem/cva6_hpdcache_*",
    "core/cache_subsystem/hpdcache_*",
    # The PMP's own test bench, with a `riscv` package of its own.
    "core/pmp/include/riscv.sv",
    "core/pmp/tb/**",
    # One configuration of the 22, each declaring `cva6_config_pkg`.
    "core/include/cv32a6_embedded_config_pkg_deprecated.sv",
    "core/include/cv32a6_ima_sv32_fpga_config_pkg.sv",
    "core/include/cv32a6_imac_sv0_config_pkg.sv",
    "core/include/cv32a6_imac_sv32_config_pkg.sv",
    "core/include/cv32a6_imafc_sv32_config_pkg.sv",
    "core/include/cv32a60x_config_pkg.sv",
    "core/include/cv32a65x_config_pkg.sv",
    "core/include/cv64a6_imadfcv_sv39_polara_config_pkg.sv",
    "core/include/cv64a6_imafdc_sv39_config_pkg.sv",
    "core/include/cv64a6_imafdc_sv39_hpdcache_config_pkg.sv",
    "core/include/cv64a6_imafdc_sv39_hpdcache_wb_config_pkg.sv",
    "core/include/cv64a6_imafdc_sv39_openpiton_config_pkg.sv",
    "core/include/cv64a6_imafdc_sv39_wb_config_pkg.sv",
    "core/include/cv64a6_imafdch_sv39_config_pkg.sv",
    "core/include/cv64a6_imafdch_sv39_wb_config_pkg.sv",
    "core/include/cv64a6_imafdchsclic_sv39_config_pkg.sv",
    "core/include/cv64a6_imafdchsclic_sv39_hpdcache_config_pkg.sv",
    "core/include/cv64a6_imafdcv_sv39_config_pkg.sv",
    "core/include/cv64a6_mmu_config_pkg.sv",
]

# Its headers, and the generated monolith alone, where the same modules are
# generated one to a file beside it.
[described.idma]
include-dirs = ["src/include", "target/rtl/include", "test"]
exclude = [
    "target/rtl/idma_backend_*",
    "target/rtl/idma_desc64_*",
    "target/rtl/idma_legalizer_*",
    "target/rtl/idma_reg*",
    "target/rtl/idma_transport_layer_*",
    "target/rtl/tb_idma_backend_*",
]
