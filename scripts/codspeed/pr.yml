$schema: https://raw.githubusercontent.com/CodSpeedHQ/codspeed/refs/heads/main/schemas/codspeed.schema.json

# What CodSpeed measures on each pull request: the benchmarks of
# `main.yml` that simulate in a few minutes, under the same names, so
# that CodSpeed compares each with main's run of it. Simulation counts the
# work a run does, so a change doing more of it shows on a small design:
# ibex, for every command. What only a larger design reaches, such as the
# drivers of what redmule builds, main's run measures.

options:
  working-directory: ../../eda-benchmarks

benchmarks:
  - name: fmt ibex
    exec: bench-astli.sh fmt --check -F ibex/variants/full/filelist.f
  - name: lint ibex
    exec: bench-astli.sh lint --top ibex_full_synth -F ibex/variants/full/filelist.f
  - name: check ibex
    exec: bench-astli.sh check --top ibex_full_synth -F ibex/variants/full/filelist.f
  - name: files ibex
    exec: bench-astli.sh files --top ibex_full_synth -F ibex/variants/full/filelist.f
