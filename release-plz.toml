# release-plz bumps versions, writes the changelog, publishes to crates.io and
# pushes the tag. dist builds the binaries and creates the GitHub release from
# that tag, so release-plz creates none.
[workspace]
git_release_enable = false
git_tag_enable = false
changelog_update = false
# Publish only when a release PR is merged. Otherwise every push would try a
# crate that is new since the last release, against the published versions
# of the crates it depends on.
release_always = false
# A break that no commit declares with a `!` would otherwise ship in a patch
# release. With the check, cargo-semver-checks compares each library crate
# with its last release, and a break bumps the version as breaking, the
# minor version at 0.x. That fixes only the version: the changelog names a
# break in its Breaking section from the `!` on the commit, which the
# `semver` job in ci.yml asks of the pull request.
semver_check = true
# The version is the page's title, so each heading sits a level above its
# place in the changelog file. The leading newline lets the first one match.
pr_body = """
{% for release in releases %}{% if release.title and release.changelog -%}
# {{ release.title }}

{% set changelog = "\n" ~ release.changelog %}
{{- changelog | replace(from="\n### ", to="\n## ") | replace(from="\n#### ", to="\n### ") }}
{% endif %}{% endfor %}
---
This PR was generated with [release-plz](https://github.com/release-plz/release-plz/).
"""

# Conventional commit types, grouped for a reader of the changelog. Tests and
# CI change nothing a user sees. `group_by` sorts groups by name, so each
# starts with a comment that orders it and the body strips.
[changelog]
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->✨ Added" },
    { message = "^fix", group = "<!-- 1 -->🐛 Fixed" },
    { message = "^perf", group = "<!-- 2 -->⚡ Performance" },
    { message = "^refactor", group = "<!-- 3 -->♻️ Changed" },
    { message = "^docs", group = "<!-- 4 -->📚 Documentation" },
    { message = "^(test|ci|chore|build)", skip = true },
    { message = ".*", group = "<!-- 5 -->Other" },
]
# Breaking changes first, since a new layout fails `astli fmt --check`. Then
# each type: its unscoped commits, then one list per scope, which `group_by`
# sorts by name.
body = """

## [{{ version | trim_start_matches(pat="v") }}]{% if release_link %}({{ release_link }}){% endif %} - {{ timestamp | date(format="%Y-%m-%d") }}
{% set breaking = commits | filter(attribute="breaking", value=true) %}{% if breaking %}
### ⚠️ Breaking

{% for commit in breaking -%}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message }}
{% endfor %}{% endif %}
{%- set rest = commits | filter(attribute="breaking", value=false) %}
{%- for group, commits in rest | group_by(attribute="group") %}
### {{ group | striptags }}
{% for commit in commits %}{% if not commit.scope %}
- {{ commit.message }}{% endif %}{% endfor %}
{% for scope, commits in commits | group_by(attribute="scope") %}
#### {{ scope }}

{% for commit in commits -%}
- {{ commit.message }}
{% endfor %}{% endfor %}{% endfor %}
"""
# A type with no unscoped commits leaves two blank lines before its first scope.
postprocessors = [{ pattern = "\n{3,}", replace = "\n\n" }]

# Every crate exposes the types of those below it, so all of them move together
# (D18 in docs/plan.md).
[[package]]
name = "astli-text"
version_group = "astli"

[[package]]
name = "astli-diag"
version_group = "astli"

[[package]]
name = "astli-syntax"
version_group = "astli"

[[package]]
name = "astli-preproc"
version_group = "astli"

[[package]]
name = "astli-parse"
version_group = "astli"

[[package]]
name = "astli-fmt"
version_group = "astli"

[[package]]
name = "astli-index"
version_group = "astli"

[[package]]
name = "astli-sema"
version_group = "astli"

[[package]]
name = "astli-lint"
version_group = "astli"

[[package]]
name = "astli-package"
version_group = "astli"

[[package]]
name = "astli-resolve"
version_group = "astli"

# One changelog for the project, kept by the umbrella since it contains all the
# rest.
[[package]]
name = "astli"
version_group = "astli"
changelog_update = true
# Not created here, but the changelog links to it.
git_tag_name = "v{{ version }}"
changelog_path = "./CHANGELOG.md"
changelog_include = [
    "astli-text",
    "astli-diag",
    "astli-syntax",
    "astli-preproc",
    "astli-parse",
    "astli-fmt",
    "astli-index",
    "astli-sema",
    "astli-lint",
    "astli-package",
    "astli-cli",
]

# One tag for the release, in the form dist expects: `v0.2.0` releases every
# package at that version.
[[package]]
name = "astli-cli"
version_group = "astli"
git_tag_enable = true
git_tag_name = "v{{ version }}"
