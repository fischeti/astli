# release-plz bumps versions, writes the changelog, publishes to crates.io and
# pushes the tag. dist builds the binaries and creates the GitHub release from
# that tag, so release-plz creates none.
[workspace]
git_release_enable = false
git_tag_enable = false
changelog_update = false
# Publish only when a release PR is merged. Otherwise every push would try a
# crate that is new since the last release, against the published versions
# of the crates it depends on.
release_always = false
# How a library's API break is found: cargo-semver-checks compares each
# library crate with its last release, and a break bumps its version as
# breaking, the minor version at 0.x. A `!` on a commit is kept for a break
# of the command, since the command's version counts every commit its
# changelog includes, the libraries' too. A break the check misses, such as
# a field changing its type, is raised by hand in the release PR.
semver_check = true
# The version is the page's title, so each heading sits a level above its
# place in the changelog file. The leading newline lets the first one match.
pr_body = """
{% for release in releases %}{% if release.title and release.changelog -%}
# {{ release.title }}

{% set changelog = "\n" ~ release.changelog %}
{{- changelog | replace(from="\n### ", to="\n## ") | replace(from="\n#### ", to="\n### ") }}
{% endif %}{% endfor %}
---
This PR was generated with [release-plz](https://github.com/release-plz/release-plz/).
"""

# Conventional commit types, grouped for a reader of the changelog. Tests and
# CI change nothing a user sees. `group_by` sorts groups by name, so each
# starts with a comment that orders it and the body strips.
[changelog]
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->✨ Added" },
    { message = "^fix", group = "<!-- 1 -->🐛 Fixed" },
    { message = "^perf", group = "<!-- 2 -->⚡ Performance" },
    { message = "^refactor", group = "<!-- 3 -->♻️ Changed" },
    { message = "^docs", group = "<!-- 4 -->📚 Documentation" },
    { message = "^(test|ci|chore|build)", skip = true },
    { message = ".*", group = "<!-- 5 -->Other" },
]
# Breaking changes first, since a new layout fails `astli fmt --check`. Then
# each type: its unscoped commits, then one list per scope, which `group_by`
# sorts by name.
body = """

## [{{ version | trim_start_matches(pat="v") }}]{% if release_link %}({{ release_link }}){% endif %} - {{ timestamp | date(format="%Y-%m-%d") }}
{% set breaking = commits | filter(attribute="breaking", value=true) %}{% if breaking %}
### ⚠️ Breaking

{% for commit in breaking -%}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message }}
{% endfor %}{% endif %}
{%- set rest = commits | filter(attribute="breaking", value=false) %}
{%- for group, commits in rest | group_by(attribute="group") %}
### {{ group | striptags }}
{% for commit in commits %}{% if not commit.scope %}
- {{ commit.message }}{% endif %}{% endfor %}
{% for scope, commits in commits | group_by(attribute="scope") %}
#### {{ scope }}

{% for commit in commits -%}
- {{ commit.message }}
{% endfor %}{% endfor %}{% endfor %}
"""
# A type with no unscoped commits leaves two blank lines before its first scope.
postprocessors = [{ pattern = "\n{3,}", replace = "\n\n" }]

# Three kinds of package, each versioned for whom it answers to (D18 in
# docs/plan.md).
#
# The libraries share one version: each exposes the types of those below it,
# so a break low down breaks everything above, and the umbrella's version
# names a set that fits.

[[package]]
name = "astli-text"
version_group = "libraries"

[[package]]
name = "astli-diag"
version_group = "libraries"

[[package]]
name = "astli-syntax"
version_group = "libraries"

[[package]]
name = "astli-preproc"
version_group = "libraries"

[[package]]
name = "astli-parse"
version_group = "libraries"

[[package]]
name = "astli-fmt"
version_group = "libraries"

[[package]]
name = "astli-index"
version_group = "libraries"

[[package]]
name = "astli-sema"
version_group = "libraries"

[[package]]
name = "astli-lint"
version_group = "libraries"

[[package]]
name = "astli"
version_group = "libraries"

# `astli-package` and `astli-resolve` serve only the driver, so each takes
# release-plz's default: a version of its own, from its own commits.

# The command is versioned by what its users see: its flags and output, what
# `fmt` writes, and the files it reads and writes. The project's changelog and
# its one tag are the command's, since the binaries dist builds, the PyPI
# wheels and the plugin all carry its version. dist releases only packages
# with a binary, so a library at the same version is no matter.
[[package]]
name = "astli-cli"
changelog_update = true
changelog_path = "./CHANGELOG.md"
changelog_include = [
    "astli-text",
    "astli-diag",
    "astli-syntax",
    "astli-preproc",
    "astli-parse",
    "astli-fmt",
    "astli-index",
    "astli-sema",
    "astli-lint",
    "astli",
    "astli-package",
    "astli-resolve",
]
git_tag_enable = true
git_tag_name = "v{{ version }}"
