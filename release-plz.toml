# release-plz bumps versions, writes the changelog, publishes to crates.io and
# pushes the tag. dist builds the binaries and creates the GitHub release from
# that tag, so release-plz creates none.
[workspace]
git_release_enable = false
git_tag_enable = false
changelog_update = false
# Publish only when a release PR is merged. Otherwise every push would try a
# crate that is new since the last release, against the published versions
# of the crates it depends on.
release_always = false
# The changelog up front, since only the umbrella keeps one. Every crate moves
# to the same version, so the package list and cargo-semver-checks' findings
# (for a 0.x minor bump, expected) fold away.
pr_body = """
## 🤖 New release
{% for release in releases %}{% if release.title and release.changelog %}
## {{ release.title }}

{{ release.changelog }}
{% endif %}{% endfor %}
<details><summary><b>Packages</b></summary>

{% for release in releases -%}
* `{{ release.package }}`: {% if release.previous_version and release.previous_version != release.next_version %}{{ release.previous_version }} -> {% endif %}{{ release.next_version }}{% if release.semver_check == "incompatible" %} (⚠ API breaking changes){% elif release.semver_check == "compatible" %} (✓ API compatible changes){% endif %}
{% endfor %}
</details>
{% for release in releases %}{% if release.breaking_changes %}
<details><summary><b>⚠ <code>{{ release.package }}</code> breaking changes</b></summary>

```text
{{ release.breaking_changes }}
```
</details>
{% endif %}{% endfor %}
---
This PR was generated with [release-plz](https://github.com/release-plz/release-plz/).
"""

# Conventional commit types, grouped for a reader of the changelog. Tests and
# CI change nothing a user sees.
[changelog]
commit_parsers = [
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Changed" },
    { message = "^docs", group = "Documentation" },
    { message = "^(test|ci|chore|build)", skip = true },
    { message = ".*", group = "Other" },
]

# Every crate exposes the types of those below it, so all of them move together
# (D18 in docs/plan.md).
[[package]]
name = "astli-text"
version_group = "astli"

[[package]]
name = "astli-diag"
version_group = "astli"

[[package]]
name = "astli-syntax"
version_group = "astli"

[[package]]
name = "astli-preproc"
version_group = "astli"

[[package]]
name = "astli-parse"
version_group = "astli"

[[package]]
name = "astli-fmt"
version_group = "astli"

[[package]]
name = "astli-index"
version_group = "astli"

[[package]]
name = "astli-sema"
version_group = "astli"

[[package]]
name = "astli-lint"
version_group = "astli"

# One changelog for the project, kept by the umbrella since it contains all the
# rest.
[[package]]
name = "astli"
version_group = "astli"
changelog_update = true
# Not created here, but the changelog links to it.
git_tag_name = "v{{ version }}"
changelog_path = "./CHANGELOG.md"
changelog_include = [
    "astli-text",
    "astli-diag",
    "astli-syntax",
    "astli-preproc",
    "astli-parse",
    "astli-fmt",
    "astli-index",
    "astli-sema",
    "astli-lint",
    "astli-cli",
]

# One tag for the release, in the form dist expects: `v0.2.0` releases every
# package at that version.
[[package]]
name = "astli-cli"
version_group = "astli"
git_tag_enable = true
git_tag_name = "v{{ version }}"
