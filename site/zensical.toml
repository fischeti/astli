[project]
site_name = "astli"
site_description = "A SystemVerilog formatter, and the preprocessor and parser behind it"
site_url = "https://fischeti.github.io/astli/"
repo_url = "https://github.com/fischeti/astli"
repo_name = "fischeti/astli"
docs_dir = "content"
extra_css = ["assets/site.css"]
site_dir = "build"
nav = [
  { "Home" = "index.md" },
  { "Formatting" = "formatting.md" },
  { "Filelists" = "filelists.md" },
  { "Command reference" = "reference/cli.md" },
]

[project.theme]
language = "en"
# The wordmark is an icon rather than an image, so that its "ast" takes the
# header's text colour in either scheme.
custom_dir = "overrides"
icon.logo = "astli/wordmark"
favicon = "assets/favicon.svg"
features = [
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
