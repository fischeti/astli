[project]
site_name = "astli"
site_description = "The SystemVerilog toolchain in one binary: format, lint and check a design, and fetch what it depends on"
site_url = "https://fischeti.github.io/astli/"
repo_url = "https://github.com/fischeti/astli"
repo_name = "fischeti/astli"
docs_dir = "content"
extra_css = ["assets/site.css"]
site_dir = "build"
nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Concepts" = [
    { "Packages" = "packages.md" },
    { "Files and designs" = "design.md" },
    { "Features and overrides" = "features.md" },
    { "Dependencies" = "dependencies.md" },
  ] },
  { "Guides" = [
    { "Formatting" = "formatting.md" },
    { "Linting" = "linting.md" },
    { "Checking" = "checking.md" },
    { "Filelists" = "filelists.md" },
    { "CI" = "ci.md" },
    { "Coming from bender" = "bender.md" },
  ] },
  { "Reference" = [
    { "Commands" = "reference/cli.md" },
    { "astli.toml" = "reference/manifest.md" },
    { "Lint rules" = "reference/lint-rules.md" },
    { "Check diagnostics" = "reference/check.md" },
    { "Environment variables" = "reference/environment.md" },
  ] },
]

[project.theme]
language = "en"
# The wordmark is an icon rather than an image, so that its "ast" takes the
# header's text colour in either scheme.
custom_dir = "overrides"
icon.logo = "astli/wordmark"
favicon = "assets/favicon.svg"
features = [
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
