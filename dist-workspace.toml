[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Pull requests build every binary, so that a release PR shows what the tag
# would. Only the tag publishes.
pr-run-mode = "upload"
# Dependabot bumps the actions in release.yml, which dist would otherwise
# refuse as a hand edit. `dist generate` still rewrites the file from scratch.
allow-dirty = ["ci"]

# The gnu binaries are built against glibc 2.28, so that they run on distros as
# old as RHEL 8 and Debian 10. The installer falls back to the static musl ones
# on anything older. dist runs inside the container, and needs a newer glibc
# than the image has, so it runs as its musl build there.
[dist.github-custom-runners]
aarch64-unknown-linux-musl = "ubuntu-22.04-arm"

[dist.github-custom-runners.x86_64-unknown-linux-gnu]
runner = "ubuntu-22.04"
container = { image = "quay.io/pypa/manylinux_2_28_x86_64", host = "x86_64-unknown-linux-musl" }

[dist.github-custom-runners.aarch64-unknown-linux-gnu]
runner = "ubuntu-22.04-arm"
container = { image = "quay.io/pypa/manylinux_2_28_aarch64", host = "aarch64-unknown-linux-musl" }
