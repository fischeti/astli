version: 2

# One PR per ecosystem a week, and nothing younger than a week: a bad release
# is usually yanked within days.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    # Its ref is a toolchain, not a version of the action: `stable`, or the
    # `rust-version` the msrv job holds the crates to.
    ignore:
      - dependency-name: dtolnay/rust-toolchain
    groups:
      actions:
        patterns: ["*"]

  # The documentation site's tools. The root pyproject.toml is the astli wheel
  # and pins nothing.
  - package-ecosystem: uv
    directory: /site
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    groups:
      site:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
    groups:
      pre-commit:
        patterns: ["*"]
