name: CodSpeed

on:
  push:
    branches: [main]
  pull_request:
  # Lets CodSpeed backtest earlier commits for a baseline.
  workflow_dispatch:

permissions:
  contents: read
  # OpenID Connect, which authenticates the upload to CodSpeed.
  id-token: write

concurrency:
  group: codspeed-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # The runs `scripts/codspeed/` lists, measured in CPU simulation: under
  # Valgrind, which counts the work a run does the same way every time, so
  # a pull request's numbers compare with main's on any runner. It runs
  # threads one at a time, so they get one each: what it measures is work,
  # and how well that work spreads over cores is for a run on real
  # hardware to show.
  benchmarks:
    runs-on: ubuntu-latest
    env:
      ASTLI_JOBS: 1
      RAYON_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Its own cache: line tables make another build than the corpus job's.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: codspeed
      # Line tables, so that CodSpeed's flame graphs name the functions.
      - run: cargo build --release -p astli-cli
        env:
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
      - run: |
          echo "$GITHUB_WORKSPACE/target/release" >>"$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/scripts" >>"$GITHUB_PATH"
      # The tarball `fetch-corpus.sh` pins, so that a run need not download
      # it: the key moves with the script, and so with the pin.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/astli-corpus
          key: eda-benchmarks-${{ hashFiles('scripts/fetch-corpus.sh') }}
      - run: scripts/fetch-corpus.sh --eda-benchmarks
      - uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          # The full suite takes about 20 minutes simulated, so a pull
          # request runs the part of it `pr.yml` lists.
          config: scripts/codspeed/${{ github.event_name == 'pull_request' && 'pr' || 'main' }}.yml
          # `bench-astli.sh` is a shell running `astli`, which is what is
          # measured.
          simulation-track-subprocess: true
