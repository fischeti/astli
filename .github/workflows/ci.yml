name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The pull request checks, on a branch without opening one.
  workflow_dispatch:

# A new push to a pull request supersedes the run before it. A push to main
# still finishes, so that every commit there has a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: taiki-e/install-action@v2.90.4
        with:
          tool: nextest
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo doc --workspace --no-deps
      - run: cargo nextest run --workspace
      # nextest runs no doctest.
      - run: cargo test --workspace --doc
      # HTTPS from a real host, which nothing else fetches from.
      - run: cargo nextest run --workspace -P network

  # Builds with Verilator from Ubuntu's archive, older than most installs,
  # so that the oldest version a user is likely to have is the one tested.
  verilator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: taiki-e/install-action@v2.90.4
        with:
          tool: nextest
      - run: sudo apt-get update && sudo apt-get install -y verilator
      - run: verilator --version
      - run: cargo nextest run -p astli-cli -P verilator

  # The conformance suite, at the commit `fetch-corpus.sh` pins. Fails when a
  # test starts failing, or one expected to fail starts passing.
  sv-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # The corpus job's release build, which shares its dependencies.
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: release
      - uses: astral-sh/setup-uv@v7.6.0
      - run: scripts/fetch-corpus.sh --sv-tests
      - run: cargo build --release -p astli-cli
      - run: scripts/sv-tests.py
      # As the formatter parses. Run even after a failure above, to see both.
      - if: ${{ !cancelled() }}
        run: scripts/sv-tests.py --raw

  # The corpus gates: real code at the commits `fetch-corpus.sh` pins, held
  # to the ratchets the `corpus_*` tests name. The repos are fetched each run
  # rather than cached, since the cache is the builds'; only the benchmark
  # designs' tarball, 11 MB, is kept. Without `slang` on the path, the
  # formatter's comparison with it skips.
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: release
      - uses: taiki-e/install-action@v2.90.4
        with:
          tool: nextest
      # The key moves with the script, and so with the pin.
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/astli-corpus
          key: eda-benchmarks-${{ hashFiles('scripts/fetch-corpus.sh') }}
      - run: scripts/fetch-corpus.sh
      - run: cargo nextest run --workspace --release -P corpus

  # The oldest toolchain `rust-version` promises. crates.io publishes it, and
  # nothing else would notice a newer feature creeping in. The promise is to
  # those who depend on the crates, so tests may use a newer one. It runs on
  # main too, so that a pull request finds its cache there rather than saving
  # one of its own.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.92
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo check --workspace

  # Paths and line endings are what differ on Windows. It runs on main too,
  # since a pull request restores only main's caches, not another's.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # Saved after a failure too, which is when the next push needs it.
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@v2.90.4
        with:
          tool: nextest
      # Every failure at once: one run should be enough to see what differs.
      - run: cargo nextest run --workspace --no-fail-fast
      # Windows verifies certificates through its own store.
      - run: cargo nextest run --workspace -P network

  # release.yml is what dist generates from dist-workspace.toml. Dependabot
  # edits the workflow alone, and checked only at release, a mismatch would
  # stop dist after crates.io has the new version.
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: |
          version=$(sed -n 's/^cargo-dist-version = "\(.*\)"$/\1/p' dist-workspace.toml)
          curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v$version/cargo-dist-installer.sh" | sh
      - run: dist generate --check

  # Each action runs at the commit actions.lock records for its ref, not
  # wherever the ref points now, so a moved tag cannot change what runs. The
  # lock has to cover every ref the workflows name.
  actions-lock:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
        env:
          GH_TOKEN: ${{ github.token }}
      - run: gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}
