name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo doc --workspace --no-deps
      # No corpus is fetched here, so the `corpus_*` tests would only skip.
      - run: cargo nextest run --workspace -P quick

  # dist builds the binaries only after release-plz has published, so a target
  # that does not compile has to be caught in the release PR. A C dependency
  # needs a compiler for its target, so each is checked on the runner dist
  # builds it on. The Windows job below builds that target.
  targets:
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        include:
          - { runner: macos-14, target: aarch64-apple-darwin }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --target ${{ matrix.target }}

  # Paths and line endings are what differ on Windows. Pull requests only, which
  # includes every release PR, so that a push to main stays one job.
  windows:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # Every failure at once: one run should be enough to see what differs.
      - run: cargo nextest run --workspace -P quick --no-fail-fast
