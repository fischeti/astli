name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The pull request checks, on a branch without opening one.
  workflow_dispatch:

# A new push to a pull request supersedes the run before it. A push to main
# still finishes, so that every commit there has a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Enough for a panic's backtrace to name the line. Full debuginfo only
  # slows the link and fattens the caches.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # The toolchain from rustup itself, which the runners ship: an action
      # wrapping it names the toolchain by a branch that is rewritten upstream,
      # so actions.lock cannot pin it. `stable` is installed rather than taken
      # from the image, which may lag the release. One line joined by `&&`
      # runs the same in bash and in Windows' PowerShell, and stops at a
      # failure in either.
      - run: rustup toolchain install stable --profile minimal --no-self-update --component rustfmt,clippy && rustup default stable
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: taiki-e/install-action@v2.90.4
        with:
          tool: nextest
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo doc --workspace --no-deps
      - run: cargo nextest run --workspace
      # nextest runs no doctest.
      - run: cargo test --workspace --doc
      # HTTPS from a real host, which nothing else fetches from.
      - run: cargo nextest run --workspace -P network

  # Builds with Verilator from Ubuntu's archive, older than most installs,
  # so that the oldest version a user is likely to have is the one tested.
  verilator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: taiki-e/install-action@v2.90.4
        with:
          tool: nextest
      - run: sudo apt-get update && sudo apt-get install -y verilator
      - run: verilator --version
      - run: cargo nextest run -p astli-cli -P verilator

  # The conformance suite, at the commit `fetch-corpus.sh` pins. Fails when a
  # test starts failing, or one expected to fail starts passing.
  sv-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: astral-sh/setup-uv@v10.3.3
      - run: scripts/fetch-corpus.sh --sv-tests
      - run: cargo build --release -p astli-cli
      - run: scripts/sv-tests.py
      # As the formatter parses. Run even after a failure above, to see both.
      - if: ${{ !cancelled() }}
        run: scripts/sv-tests.py --raw

  # The corpus gates: real code at the commits `fetch-corpus.sh` pins, held
  # to the ratchets the `corpus_*` tests name. The repos are fetched each run
  # rather than cached, since the cache is the builds'; only the benchmark
  # designs' tarball, 11 MB, is kept. Without `slang` on the path, the
  # formatter's comparison with it skips.
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      # Not the sv-tests job's cache: the dev-dependencies a workspace's tests
      # bring change the features of shared dependencies, so its build of the
      # binary alone would leave this job rebuilding them all.
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: taiki-e/install-action@v2.90.4
        with:
          tool: nextest
      # The key moves with the script, and so with the pin.
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/astli-corpus
          key: eda-benchmarks-${{ hashFiles('scripts/fetch-corpus.sh') }}
      - run: scripts/fetch-corpus.sh
      # The gates live in each crate's `it` binary, so the unit tests' release
      # binaries need not be built.
      - run: cargo nextest run --workspace --release -P corpus --test it

  # The oldest toolchain `rust-version` promises. crates.io publishes it, and
  # nothing else would notice a newer feature creeping in. The promise is to
  # those who depend on the crates, so tests may use a newer one. It runs on
  # main too, so that a pull request finds its cache there rather than saving
  # one of its own.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Read from Cargo.toml, so that the two cannot fall out of step.
      - run: |
          toolchain=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          rustup toolchain install "$toolchain" --profile minimal --no-self-update
          rustup default "$toolchain"
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo check --workspace

  # Paths and line endings are what differ on Windows. It runs on main too,
  # since a pull request restores only main's caches, not another's.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # The build and the tests run from a copy on a Dev Drive. Trusted, it
      # is one Defender scans asynchronously, where on the system drive each
      # of a build's many small writes waits for the scan; the runner is
      # thrown away with the job, so there is nothing to protect.
      - uses: samypr100/setup-dev-drive@v4.1.0
        with:
          drive-size: 8GB
          workspace-copy: true
          trusted-dev-drive: true
      - run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      # Saved after a failure too, which is when the next push needs it.
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: ${{ env.DEV_DRIVE_WORKSPACE }}
          cache-on-failure: true
      - uses: taiki-e/install-action@v2.90.4
        with:
          tool: nextest
      # Every failure at once: one run should be enough to see what differs.
      - run: cargo nextest run --workspace --no-fail-fast
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
      # Windows verifies certificates through its own store.
      - run: cargo nextest run --workspace -P network
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}

  # release.yml is what dist generates from dist-workspace.toml. Dependabot
  # edits the workflow alone, and checked only at release, a mismatch would
  # stop dist after crates.io has the new version.
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: |
          version=$(sed -n 's/^cargo-dist-version = "\(.*\)"$/\1/p' dist-workspace.toml)
          curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v$version/cargo-dist-installer.sh" | sh
      - run: dist generate --check

  # The VS Code extension, packaged as the release packages it, without a
  # binary, so that a break shows before a release tries to publish it.
  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: npm ci
      - run: npm run check
      - run: npx vsce package

  # Each action runs at the commit actions.lock records for its ref, not
  # wherever the ref points now, so a moved tag cannot change what runs. The
  # lock has to cover every ref the workflows name.
  actions-lock:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
        env:
          GH_TOKEN: ${{ github.token }}
      - run: gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}
