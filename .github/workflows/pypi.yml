# The `astli` binary as Python wheels on PyPI, for the targets dist builds for.
# Runs on the tag release-plz pushes, beside dist's release.yml. The tag comes
# after crates.io, so pull requests build the wheels too, to catch a broken one
# in the release PR. That also compiles every target dist builds, C dependency
# included, before dist sees the tag.
name: PyPI

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  wheels:
    runs-on: ${{ matrix.runner }}
    strategy:
      # One failure should not hide another.
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64 }
          # Natively: the cross manylinux image has a gcc too old for the flags
          # mimalloc passes.
          - { runner: ubuntu-24.04-arm, target: aarch64 }
          # For Alpine and other musl distros.
          - { runner: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { runner: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
          # One Apple Silicon runner builds both; Rust cross-compiles to Intel.
          - { runner: macos-latest, target: aarch64 }
          - { runner: macos-latest, target: x86_64 }
          - { runner: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # The same profile and glibc baseline as the dist binaries.
          args: --profile dist --out dist
          manylinux: ${{ matrix.manylinux || '2_28' }}
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.manylinux || '2_28' }}
          path: dist

  # For a platform without a wheel, pip builds this with cargo.
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  publish:
    needs: [wheels, sdist]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI accepts this workflow in this environment, so no
    # token is stored.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: astral-sh/setup-uv@v7
      - run: uv publish --trusted-publishing always dist/*
