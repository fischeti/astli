# The documentation site, on GitHub Pages. Its command reference comes from the
# CLI it is built with, so it deploys from the tag release-plz pushes, and not
# from main, which may have flags no release has. The release PR builds it, to
# catch a broken site before the tag; other pull requests skip it. To deploy a
# fix to the pages alone, run this on demand from the latest tag.
name: Site

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    if: ${{ github.event_name != 'pull_request' || startsWith(github.head_ref, 'release-plz-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # No caches: what this builds is deployed, and a cache another run saved
      # could change it. It builds once a release.
      - uses: astral-sh/setup-uv@v7.6.0
        with:
          enable-cache: false
      - uses: taiki-e/install-action@v2.90.4
        with:
          tool: cargo-binstall
      - run: cargo binstall --no-confirm usage-cli
      - run: scripts/site.sh
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site/build

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
