[workspace]
resolver = "3"
members = ["crates/*"]
# So that `cargo run` needs no `-p`. It also narrows what a bare `cargo build`,
# `cargo test` or `cargo fmt` acts on, which is why the hooks and the documented
# commands all say `--workspace` or `--all` out loud.
default-members = ["crates/svirig"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fischeti/svirig"

[workspace.dependencies]
logos = "0.16"
rowan = "0.17"
rustc-hash = "2"
usage = { package = "usage-rs", version = "6", features = ["completions"] }

svirig-parse = { path = "crates/svirig-parse" }
svirig-preproc = { path = "crates/svirig-preproc" }
svirig-syntax = { path = "crates/svirig-syntax" }
svirig-text = { path = "crates/svirig-text" }

[workspace.lints.rustdoc]
all = "deny"

[profile.dist]
inherits = "release"
lto = "thin"
