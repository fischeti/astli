# Only the checks that need no build, so a commit stays instant: CI runs
# clippy and the docs build. The message is checked on its own.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt
        language: system
        pass_filenames: false
        types_or: [rust]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        # Generated by `dist generate`; its shellcheck notes are for dist to fix.
        exclude: ^\.github/workflows/release\.yml$

  - repo: https://github.com/crate-ci/typos
    rev: v1.51.1
    hooks:
      - id: typos
        # What astli prints over real designs: commit ids and their
        # identifiers, which are not words to correct.
        exclude: ^scripts/corpus/

  # release-plz reads the type for the version bump and the changelog group. A
  # scope names the crate a change is in.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: ["--scopes=astli,text,diag,syntax,preproc,parse,fmt,index,sema,lint,package,resolve,cli"]
