# The Rust checks are split across commit and push; the message is checked on
# its own.
default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt
        language: system
        pass_filenames: false
        types_or: [rust]

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        pass_filenames: false
        types_or: [rust, toml]
        stages: [pre-push]

      - id: cargo-doc
        name: cargo doc
        entry: cargo doc --workspace --no-deps --quiet
        language: system
        pass_filenames: false
        types_or: [rust, toml]
        stages: [pre-push]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        # Generated by `dist generate`; its shellcheck notes are for dist to fix.
        exclude: ^\.github/workflows/release\.yml$

  - repo: https://github.com/crate-ci/typos
    rev: v1.49.0
    hooks:
      - id: typos

  # release-plz reads the type for the version bump and the changelog group. A
  # scope names the crate a change is in.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: ["--scopes=astli,text,diag,syntax,preproc,parse,fmt,cli"]
