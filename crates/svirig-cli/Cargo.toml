[package]
name = "svirig-cli"
description = "The svirig command: SystemVerilog formatting, and a dump of each stage of the pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "development-tools"]
readme.workspace = true
include = ["src/**/*"]

# The package takes the suffix so that the bare name can be the library. The
# binary's docs would land in the library's `target/doc/svirig/`, so only the
# library's are built.
[[bin]]
name = "svirig"
path = "src/main.rs"
doc = false

[lints]
workspace = true

[dependencies]
rayon.workspace = true
rowan.workspace = true
similar.workspace = true
usage.workspace = true
svirig-diag.workspace = true
svirig-fmt.workspace = true
svirig-parse.workspace = true
svirig-preproc.workspace = true
svirig-syntax.workspace = true
svirig-text.workspace = true
