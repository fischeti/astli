[package]
name = "svirig-syntax"
description = "Lossless syntax tree, lexer, and preprocessor for SystemVerilog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
logos.workspace = true
rowan.workspace = true
rustc-hash.workspace = true

# The library needs no spans: a `Token` carries bare offsets into the text it
# was lexed from. Only `dump-tokens` wants the store, to print a line number.
[dev-dependencies]
svirig-text.workspace = true
