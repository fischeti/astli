[package]
name = "astli-diag"
description = "Rendering a SystemVerilog diagnostic: snippets, and the chains that explain them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
include = ["src/**/*"]

[lints]
workspace = true

[dependencies]
ariadne.workspace = true
rustc-hash.workspace = true
astli-text.workspace = true

# Path only, so that publishing drops it: `astli-preproc` depends on this crate
# and is published after it, and the tests that use it are not packaged anyway.
[dev-dependencies]
astli-preproc = { path = "../astli-preproc" }
